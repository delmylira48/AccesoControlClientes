<!DOCTYPE html>
<html lang="en"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="#{admin.titulo}"></title>
</head>
<body>

<header th:replace="~{layout/plantilla :: header}"></header>

<h1 th:text="#{admin.titulo}"></h1>
<a th:href="@{/home}">Regresar</a>

<div th:if="${success}" class="alert alert-success">
    <p th:text="${success}"></p>
</div>

<div th:if="${error}" class="alert alert-success">
    <p th:text="${error}"></p>
</div>
<br>
<table border="1">
    <thead>
    <tr>
        <th>Usuario</th>
        <th>Acción</th>
    </tr>
    </thead>

    <tbody th:if="${usuariosAdmin != null and !usuariosAdmin.empty}">
        <tr th:each="usuario : ${usuariosAdmin}">
            <td th:text="${usuario.username}">Mostrar username</td>
            <td>
                <form th:action="@{/admin/quitarAdmin}" method="post">
                    <input type="hidden" name="id" th:value="${usuario.id}" />
                    <button type="submit" style="cursor:pointer; padding:0; margin:0;" th:disabled="${usuario.id == usuarioAutenticado.id}">Quitar admin</button>
                </form>
            </td>
        </tr>
    </tbody>
    <tbody th:if="${usuariosAdmin == null or usuariosAdmin.empty}">
        <tr>
            <td colspan="2">La lista está vacia </td>
        </tr>
    </tbody>
</table>

<br>
<h2>Agregar nuevos roles</h2>
<br>
<table border="1">
    <thead>
    <tr>
        <th>Usuario</th>
        <th> Acción</th>
    </tr>
    </thead>
    <tbody th:if="${usuarios != null or !usuarios.empty}">
    <tr th:each = "usuario : ${usuarios}">
        <td th:text="${usuario.username}">username</td>
        <td>
            <form th:action="@{/admin/agregarAdmin}" method="post">
                <input type="hidden" name="id" th:value="${usuario.id}" />
                <button type="submit" style="cursor:pointer; padding:0; margin:0;" th:disabled="${usuario.id == usuarioAutenticado.id}">Agregar admin</button>
            </form>
        </td>
    </tr>
    </tbody>
    <tbody th:if="${usuarios == null and usuarios.empty}">
    <tr>
        <td colspan="2">No hay usuarios para agregar</td>
    </tr>
    </tbody>
</table>

<footer th:replace="~{layout/plantilla :: footer}"></footer>
</body>
</html>
